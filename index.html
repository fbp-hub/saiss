<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Privado</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #1e1b4b, var(--bg-color));
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      transition: all 0.3s ease;
    }

    .card h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: var(--error-color);
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }

    /* Animación de error (sacudida) */
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Contenedor del reproductor cuando se desbloquea */
    #video-wrapper {
      display: none;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Formulario de contraseña -->
    <div class="card" id="lock-card">
      <h1>Contenido Protegido</h1>
      <p>Introduce la contraseña de acceso para reproducir el vídeo.</p>
      
      <form id="pass-form" onsubmit="event.preventDefault(); unlockVideo();">
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="submit-btn">Acceder</button>
        <div id="error-msg" class="error-msg">Contraseña incorrecta. Inténtalo de nuevo.</div>
      </form>
    </div>

    <!-- Contenedor del Vídeo Decodificado -->
    <div id="video-wrapper"></div>
  </div>

  <script>
    // Cadena cifrada con AES-GCM (NO contiene texto plano)
    const ENCRYPTED_PAYLOAD = {
      salt: "7320616973733230323673616c743031",
      iv: "663161323362346335643665",
      ciphertext: "3a07ed4715f33333e6f66ea6d81eaed141f1ca9e04fbe7d5ebf6004b5a4ce8d19d186c3eb9ad4b3f88647009bb33e08f23f6cb4025d57b44747eb6ecf945038c35f29910d643fe7d0cff0fe12f2bc7d25e408ec2e5c8eebf0f975eb1ed4fbd103bda98c6bcfa24fbe29f37c35ff6412f719aa2df93ee7248f7eeef6b29cd1331be272eb9fa60814a04d60a169b1396a8eb881aa59dbbeea91cb09ed4117b96057a1b026cc358d34346caeaed88c039757f59dcc81ce024347eb1bd"
    };

    // Auxiliar para convertir hexadecimal a bytes
    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }

    // Derivación de clave mediante PBKDF2
    async function deriveKey(password, saltBytes) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBytes,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    // Función principal para desencriptar el reproductor
    async function unlockVideo() {
      const passInput = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");
      const lockCard = document.getElementById("lock-card");
      const submitBtn = document.getElementById("submit-btn");

      errorMsg.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerText = "Verificando...";

      try {
        const saltBytes = hexToBytes(ENCRYPTED_PAYLOAD.salt);
        const ivBytes = hexToBytes(ENCRYPTED_PAYLOAD.iv);
        const cipherBytes = hexToBytes(ENCRYPTED_PAYLOAD.ciphertext);

        // Generar clave a partir de la contraseña introducida
        const key = await deriveKey(passInput, saltBytes);

        // Intentar descifrar el bloque AES-GCM
        const decryptedBuffer = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: ivBytes },
          key,
          cipherBytes
        );

        const dec = new TextDecoder();
        const decryptedHtml = dec.decode(decryptedBuffer);

        // Si la desencriptación tiene éxito, inyectamos el HTML del iframe
        lockCard.style.display = "none";
        const videoWrapper = document.getElementById("video-wrapper");
        videoWrapper.innerHTML = decryptedHtml;
        videoWrapper.style.display = "block";

      } catch (e) {
        // Si la clave no es correcta, AES-GCM lanza una excepción
        submitBtn.disabled = false;
        submitBtn.innerText = "Acceder";
        errorMsg.style.display = "block";
        lockCard.classList.remove("shake");
        void lockCard.offsetWidth; // Forzar reflow de animación
        lockCard.classList.add("shake");
        document.getElementById("password").value = "";
      }
    }
  </script>
</body>
</html>
